<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{}, ~{})}"
    th:with="activePage='quoteParts'">

<head>
    <title>판매부품 실적관리 - BARATEC</title>
</head>

<body>
    <div class="content">
        <h1 class="mb-4 text-center">판매부품 실적관리</h1>

        <div class="mb-3 d-flex flex-wrap gap-2 align-items-center">
            <a href="/sales-parts/new" class="btn btn-primary">새 실적 추가</a>
            <a href="/sales-parts/bulk" class="btn btn-success">📊 대량 등록</a>

            <form method="get" action="/sales-parts" class="ms-auto d-flex flex-wrap gap-2 align-items-center">
                <label for="customer" class="form-label mb-0">고객</label>
                <input id="customer" name="customer" type="text" class="form-control form-control-sm"
                    style="width: 140px;" placeholder="고객명" th:value="${customer}">
                <label for="factoryName" class="form-label mb-0">공장명</label>
                <input id="factoryName" name="factoryName" type="text" class="form-control form-control-sm"
                    style="width: 140px;" placeholder="공장명" th:value="${factoryName}">
                <label for="quoteNo" class="form-label mb-0">견적NO.</label>
                <input id="quoteNo" name="quoteNo" type="text" class="form-control form-control-sm"
                    style="width: 140px;" placeholder="견적번호" th:value="${quoteNo}">
                <label for="poNo" class="form-label mb-0">PO 번호</label>
                <input id="poNo" name="poNo" type="text" class="form-control form-control-sm"
                    style="width: 140px;" placeholder="PO 번호" th:value="${poNo}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">필터</button>
            </form>
        </div>

        <div th:if="${list.isEmpty()}" class="alert alert-info">
            등록된 판매부품 실적이 없습니다.
        </div>

        <div th:if="${!list.isEmpty()}" class="table-responsive">
            <table class="table table-striped table-bordered table-hover" style="font-size: 0.65rem;">
                <thead>
                    <tr style="background-color: #2c3e50; color: white;">
                        <th class="col-short" style="width: 3%;">No.</th>
                        <th class="col-medium" style="width: 5%;">고객</th>
                        <th class="col-medium" style="width: 5%;">공장명</th>
                        <th class="col-long" style="width: 7%;">내용</th>
                        <th class="col-medium" style="width: 5%;">견적NO.</th>
                        <th class="col-medium" style="width: 5%;">견적금액</th>
                        <th class="col-medium" style="width: 5%;">발주일(발주번호)</th>
                        <th class="col-medium" style="width: 5%;">발주금액(부가세X)</th>
                        <th class="col-medium" style="width: 5%;">납품일</th>
                        <th class="col-medium" style="width: 5%;">계산서발행일</th>
                        <th class="col-medium" style="width: 5%;">결제일</th>
                        <th class="col-medium" style="width: 5%;">No.PO</th>
                        <th class="col-medium" style="width: 5%;">발주금액</th>
                        <th class="col-medium" style="width: 5%;">발주금액[엔→₩]</th>
                        <th class="col-medium" style="width: 5%;">입고일</th>
                        <th class="col-medium" style="width: 5%;">Invoice</th>
                        <th class="col-medium" style="width: 5%;">Inv날짜</th>
                        <th class="col-short" style="width: 4%;">60/90DAY</th>
                        <th class="col-medium" style="width: 5%;">무라타 송금일</th>
                        <th class="col-medium" style="width: 5%;">운송회사</th>
                        <th class="col-medium" style="width: 5%;">관세</th>
                        <th class="col-medium" style="width: 5%;">부가세</th>
                        <th class="col-medium" style="width: 5%;">운임 및 통관비</th>
                        <th class="col-medium" style="width: 5%;">수입총비용</th>
                        <th class="col-medium" style="width: 5%;">순이익</th>
                        <th class="col-short" style="width: 4%;">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item, iterStat : ${list}">
                        <td th:text="${iterStat.count}"></td>
                        <td th:text="${item.customer}"></td>
                        <td th:text="${item.factoryName}"></td>
                        <td th:text="${item.content}"></td>
                        <td th:text="${item.quoteNo}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.quoteAmount, 1, 2, 'COMMA')}"></td>
                        <td th:text="${item.orderDateOrderNo}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.orderAmountExclVat, 1, 2, 'COMMA')}"></td>
                        <td th:text="${item.deliveryDate}"></td>
                        <td th:text="${item.invoiceIssueDate}"></td>
                        <td th:text="${item.paymentDate}"></td>
                        <td th:text="${item.poNo}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.orderAmount, 1, 2, 'COMMA')}"></td>
                        <td class="text-end" th:text="${'￥' + #numbers.formatDecimal(item.orderAmountJpyToKrw, 1, 2, 'COMMA')}"></td>
                        <td th:text="${item.warehouseReceiptDate}"></td>
                        <td th:text="${item.invoice}"></td>
                        <td th:text="${item.invoiceDate}"></td>
                        <td th:text="${item.days6090}"></td>
                        <td th:text="${item.murataRemittanceDate}"></td>
                        <td th:text="${item.shippingCompany}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.customsDuty, 1, 2, 'COMMA')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.vat, 1, 2, 'COMMA')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.freightCustoms, 1, 2, 'COMMA')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.totalImportCost, 1, 2, 'COMMA')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(item.netProfit, 1, 2, 'COMMA')}"></td>
                        <td>
                            <div class="d-flex gap-1 justify-content-center">
                                <a th:href="@{/sales-parts/edit/{id}(id=${item.id})}"
                                    class="btn btn-sm btn-outline-primary px-2" title="수정" aria-label="수정">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/sales-parts/delete/{id}(id=${item.id})}"
                                    class="btn btn-sm btn-outline-danger px-2" title="삭제" aria-label="삭제"
                                    onclick="return confirm('삭제하시겠습니까?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
