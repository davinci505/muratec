<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{}, ~{})}"
      th:with="activePage='quoteParts'">

<head>
    <title>판매부품 실적 대량 등록 - BARATEC</title>
</head>

<body>
    <div class="content">
        <h1 class="mb-4 text-center">판매부품 실적 대량 등록</h1>

        <div class="alert alert-info">
            <h5>엑셀에서 복사하여 붙여넣기 (탭 구분)</h5>
            <p class="mb-1">열 순서: 고객, 공장명, 내용, 견적NO., 견적금액, 발주일(발주번호), 발주금액(부가세X), 납품일, 계산서발행일, 결제일, No.PO, 발주금액, 발주금액[엔➝₩], 입고일, Invoice, Inv날짜, 60/90DAY, 무라타 송금일, 운송회사, 관세, 부가세, 운임 및 통관비, 수입총비용, 순이익</p>
            <p class="mb-0">날짜 형식: YYYY-MM-DD (예: 2024-01-15)</p>
        </div>

        <div class="mb-3">
            <label for="bulkData" class="form-label">데이터 붙여넣기 (헤더 제외)</label>
            <textarea class="form-control" id="bulkData" rows="15" placeholder="고객1\t공장1\t내용1\tQ-001\t1000000\t2024-01-15 (PO-001)\t900000\t2024-02-01\t2024-02-10\t2024-03-01\tPO-001\t1000000\t10000000\t2024-02-15\tINV-001\t2024-02-10\t60\t2024-03-05\tCJ대한통운\t50000\t100000\t200000\t1350000\t-350000"></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="button" id="btnSubmit" class="btn btn-primary">등록</button>
            <a href="/sales-parts" class="btn btn-secondary">취소</a>
        </div>

        <div id="result" class="mt-3"></div>
    </div>
</body>

<script>
    document.getElementById('btnSubmit').addEventListener('click', async () => {
        const textarea = document.getElementById('bulkData');
        const resultDiv = document.getElementById('result');
        const text = textarea.value.trim();
        
        if (!text) {
            alert('데이터를 입력하세요.');
            return;
        }

        const lines = text.split('\n').filter(line => line.trim());
        const requests = [];

        for (let i = 0; i < lines.length; i++) {
            const cols = lines[i].split('\t');
            if (cols.length < 23) {
                resultDiv.innerHTML = `<div class="alert alert-danger">줄 ${i+1}: 열 개수가 맞지 않습니다. (${cols.length}/23)</div>`;
                return;
            }

            const parseDate = (str) => {
                if (!str || !str.trim()) return null;
                const s = str.trim();
                // 이미 YYYY-MM-DD 형식인 경우 그대로
                if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
                // YYYYMMDD 형식인 경우 변환
                if (/^\d{8}$/.test(s)) return s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6);
                return null;
            };

            const parseNumber = (str) => {
                if (!str || !str.trim()) return null;
                const num = str.trim().replace(/[^0-9.-]/g, '');
                return num ? parseFloat(num) : null;
            };

            requests.push({
                customer: cols[0]?.trim(),
                factoryName: cols[1]?.trim(),
                content: cols[2]?.trim(),
                quoteNo: cols[3]?.trim(),
                quoteAmount: parseNumber(cols[4]),
                orderDateOrderNo: cols[5]?.trim(),
                orderAmountExclVat: parseNumber(cols[6]),
                deliveryDate: parseDate(cols[7]),
                invoiceIssueDate: parseDate(cols[8]),
                paymentDate: parseDate(cols[9]),
                poNo: cols[10]?.trim(),
                orderAmount: parseNumber(cols[11]),
                orderAmountJpyToKrw: parseNumber(cols[12]),
                warehouseReceiptDate: parseDate(cols[13]),
                invoice: cols[14]?.trim(),
                invoiceDate: parseDate(cols[15]),
                days6090: cols[16]?.trim(),
                murataRemittanceDate: parseDate(cols[17]),
                shippingCompany: cols[18]?.trim(),
                customsDuty: parseNumber(cols[19]),
                vat: parseNumber(cols[20]),
                freightCustoms: parseNumber(cols[21]),
                totalImportCost: parseNumber(cols[22]),
                netProfit: parseNumber(cols[23])
            });
        }

        try {
            const response = await fetch('/sales-parts/bulk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requests)
            });

            const result = await response.text();
            if (result.startsWith('success:')) {
                const count = result.split(':')[1];
                resultDiv.innerHTML = `<div class="alert alert-success">${count}건이 성공적으로 등록되었습니다.</div>`;
                textarea.value = '';
                setTimeout(() => window.location.href = '/sales-parts', 1500);
            } else {
                resultDiv.innerHTML = `<div class="alert alert-danger">오류: ${result}</div>`;
            }
        } catch (err) {
            resultDiv.innerHTML = `<div class="alert alert-danger">오류 발생: ${err.message}</div>`;
        }
    });
</script>
</html>
