<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{}, ~{::script})}"
      th:with="activePage='quoteParts'">
<head>
    <title th:text="${entity.id != null ? '판매부품 실적 수정 - BARATEC' : '새 판매부품 실적 추가 - BARATEC'}">Sales Parts Performance Form</title>
</head>
<body>
    <div class="content">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0" th:text="${entity.id != null ? '판매부품 실적 수정' : '새 판매부품 실적 추가'}"></h2>
                    </div>
                    <div class="card-body">
                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                        <form th:action="${entity.id != null ? '/sales-parts/' + entity.id : '/sales-parts'}"
                              th:object="${entity}"
                              method="post">

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="customer" class="form-label">고객</label>
                                    <input type="text" class="form-control" id="customer" th:field="*{customer}">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="factoryName" class="form-label">공장명</label>
                                    <input type="text" class="form-control" id="factoryName" th:field="*{factoryName}">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="quoteNo" class="form-label">견적NO.</label>
                                    <input type="text" class="form-control" id="quoteNo" th:field="*{quoteNo}">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="content" class="form-label">내용</label>
                                <textarea class="form-control" id="content" th:field="*{content}" rows="2"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label for="quoteAmount" class="form-label">견적금액</label>
                                    <input type="text" class="form-control" id="quoteAmount" th:field="*{quoteAmount}" placeholder="금액 입력">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="orderDateOrderNo" class="form-label">발주일(발주번호)</label>
                                    <input type="text" class="form-control" id="orderDateOrderNo" th:field="*{orderDateOrderNo}" placeholder="예: 2024-01-15 (PO-123)">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="orderAmountExclVat" class="form-label">발주금액(부가세X)</label>
                                    <input type="text" class="form-control" id="orderAmountExclVat" th:field="*{orderAmountExclVat}" placeholder="금액 입력">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label for="deliveryDate" class="form-label">납품일</label>
                                    <input type="date" class="form-control" id="deliveryDate" th:field="*{deliveryDate}">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="invoiceIssueDate" class="form-label">계산서발행일</label>
                                    <input type="date" class="form-control" id="invoiceIssueDate" th:field="*{invoiceIssueDate}">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="paymentDate" class="form-label">결제일</label>
                                    <input type="date" class="form-control" id="paymentDate" th:field="*{paymentDate}">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="poNo" class="form-label">No.PO</label>
                                    <input type="text" class="form-control" id="poNo" th:field="*{poNo}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label for="orderAmount" class="form-label">발주금액</label>
                                    <input type="text" class="form-control" id="orderAmount" th:field="*{orderAmount}" placeholder="금액 입력">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="orderAmountJpyToKrw" class="form-label">발주금액[엔➝₩]</label>
                                    <input type="text" class="form-control" id="orderAmountJpyToKrw" th:field="*{orderAmountJpyToKrw}" placeholder="금액 입력 (엔화)">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="warehouseReceiptDate" class="form-label">입고일</label>
                                    <input type="date" class="form-control" id="warehouseReceiptDate" th:field="*{warehouseReceiptDate}">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="invoice" class="form-label">Invoice</label>
                                    <input type="text" class="form-control" id="invoice" th:field="*{invoice}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label for="invoiceDate" class="form-label">Inv날짜</label>
                                    <input type="date" class="form-control" id="invoiceDate" th:field="*{invoiceDate}">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="days6090" class="form-label">60/90DAY</label>
                                    <input type="text" class="form-control" id="days6090" th:field="*{days6090}" placeholder="예: 60, 90">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="murataRemittanceDate" class="form-label">무라타 송금일</label>
                                    <input type="date" class="form-control" id="murataRemittanceDate" th:field="*{murataRemittanceDate}">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="shippingCompany" class="form-label">운송회사</label>
                                    <input type="text" class="form-control" id="shippingCompany" th:field="*{shippingCompany}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label for="customsDuty" class="form-label">관세</label>
                                    <input type="text" class="form-control" id="customsDuty" th:field="*{customsDuty}" placeholder="금액 입력">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="vat" class="form-label">부가세</label>
                                    <input type="text" class="form-control" id="vat" th:field="*{vat}" placeholder="금액 입력">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="freightCustoms" class="form-label">운임 및 통관비</label>
                                    <input type="text" class="form-control" id="freightCustoms" th:field="*{freightCustoms}" placeholder="금액 입력">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="totalImportCost" class="form-label">수입총비용</label>
                                    <input type="text" class="form-control" id="totalImportCost" th:field="*{totalImportCost}" placeholder="금액 입력">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label for="netProfit" class="form-label">순이익</label>
                                    <input type="text" class="form-control" id="netProfit" th:field="*{netProfit}" placeholder="금액 입력">
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <span th:text="${entity.id != null ? '수정' : '등록'}"></span>
                                </button>
                                <a href="/sales-parts" class="btn btn-secondary">취소</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script th:inline="javascript">
    const errorMessage = /*[[${errorMessage}]]*/ null;
    if (errorMessage) {
        alert(errorMessage);
    }
</script>
<script>
    const datePattern = /^\d{4}-\d{2}-\d{2}$/;

    function formatDateInput(input) {
        if (!input) return;
        const raw = (input.value || '').replace(/\D/g, '').slice(0, 8);
        if (raw.length === 8) {
            input.value = raw.slice(0, 4) + '-' + raw.slice(4, 6) + '-' + raw.slice(6);
        }
    }

    function isValidDateValue(value) {
        if (!datePattern.test(value)) {
            return false;
        }
        const parts = value.split('-').map(Number);
        const year = parts[0];
        const month = parts[1];
        const day = parts[2];
        const date = new Date(year, month - 1, day);
        return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
    }

    function validateDateInput(input) {
        if (!input) return true;
        const value = (input.value || '').trim();
        const isValid = value === '' || isValidDateValue(value);
        input.classList.toggle('is-invalid', !isValid);
        return isValid;
    }

    function bindDateInput(input) {
        if (!input) return;
        input.addEventListener('blur', () => {
            formatDateInput(input);
            validateDateInput(input);
        });
    }

    function bindCurrencyInput(input, prefix) {
        if (!input) return;
        
        let initVal = input.value.replace(/[^0-9.]/g, '');
        if (initVal) {
            input.value = (prefix || '') + Number(initVal).toLocaleString();
        }

        input.addEventListener('blur', () => {
            let value = input.value.replace(/[^0-9.]/g, '');
            if (value) {
                input.value = (prefix || '') + Number(value).toLocaleString();
            }
        });

        input.addEventListener('focus', () => {
            let value = input.value.replace(/[^0-9.]/g, '');
            input.value = value;
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const dateInputs = [
            document.getElementById('deliveryDate'),
            document.getElementById('invoiceIssueDate'),
            document.getElementById('paymentDate'),
            document.getElementById('warehouseReceiptDate'),
            document.getElementById('invoiceDate'),
            document.getElementById('murataRemittanceDate')
        ];

        dateInputs.forEach(input => {
            bindDateInput(input);
            validateDateInput(input);
        });

        const currencyInputs = [
            {id: 'quoteAmount', prefix: ''},
            {id: 'orderAmountExclVat', prefix: ''},
            {id: 'orderAmount', prefix: ''},
            {id: 'orderAmountJpyToKrw', prefix: '￥'},
            {id: 'customsDuty', prefix: ''},
            {id: 'vat', prefix: ''},
            {id: 'freightCustoms', prefix: ''},
            {id: 'totalImportCost', prefix: ''},
            {id: 'netProfit', prefix: ''}
        ];

        currencyInputs.forEach(({id, prefix}) => {
            const input = document.getElementById(id);
            if (input) bindCurrencyInput(input, prefix);
        });

        const form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', (event) => {
                let isValid = true;

                dateInputs.forEach(input => {
                    if (input) {
                        formatDateInput(input);
                        if (!validateDateInput(input)) {
                            isValid = false;
                        }
                    }
                });

                if (!isValid) {
                    alert('날짜 형식이 올바르지 않습니다. YYYY-MM-DD 형식으로 입력하세요.');
                    event.preventDefault();
                    return;
                }

                currencyInputs.forEach(({id}) => {
                    const input = document.getElementById(id);
                    if (input && input.value) {
                        input.value = input.value.replace(/[^0-9.]/g, '');
                    }
                });
            });
        }
    });
</script>
</html>
