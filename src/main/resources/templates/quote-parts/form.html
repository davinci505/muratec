<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{}, ~{::script})}"
      th:with="activePage='quoteParts'">
<head>
    <title th:text="${quotePart.id != null ? '발주 부품 수정 - BARATEC' : '발주 부품 추가 - BARATEC'}">Quote Part Form</title>
</head>
<body>
    <div class="content">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0" th:text="${quotePart.id != null ? '발주 부품 수정' : '발주 부품 추가'}"></h2>
                    </div>
                    <div class="card-body">
                        <form th:action="${quotePart.id != null ? '/quote-parts/' + quotePart.id : '/quote-parts'}"
                              th:object="${quotePart}"
                              method="post">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="quoteId" class="form-label">CCS견적번호</label>
                                    <select id="quoteId" name="quoteId" class="form-select">
                                        <option value="">선택하세요</option>
                                        <option th:each="q : ${quotes}" th:value="${q.id}"
                                                th:text="${q.ccsQuoteNo}"
                                                th:attr="data-factory-name=${q.jobRequest != null ? q.jobRequest.factoryName : ''}"
                                                th:selected="${quotePart.quote != null and quotePart.quote.id == q.id}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="ccsPoNo" class="form-label">CCS PO번호</label>
                                    <input type="text" class="form-control" id="ccsPoNo" th:field="*{ccsPoNo}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="productName" class="form-label">제품명</label>
                                    <input type="text" class="form-control" id="productName" th:field="*{productName}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="partNoProductSpec" class="form-label">품번/제품스펙</label>
                                    <input type="text" class="form-control" id="partNoProductSpec" th:field="*{partNoProductSpec}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="workNoSerialNo" class="form-label">작번/시리얼넘버</label>
                                    <input type="text" class="form-control" id="workNoSerialNo" th:field="*{workNoSerialNo}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label for="orderQuantity" class="form-label">발주수량</label>
                                    <input type="number" class="form-control" id="orderQuantity" th:field="*{orderQuantity}">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="ccsPoAmount" class="form-label">CCS PO금액 (￥)</label>
                                    <input type="text" class="form-control" id="ccsPoAmount" th:field="*{ccsPoAmount}" placeholder="금액 입력 시 ￥ 자동생성">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="hmxOrderNo" class="form-label">HMX발주번호</label>
                                    <input type="text" class="form-control" id="hmxOrderNo" th:field="*{hmxOrderNo}">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="hmxOrderAmount" class="form-label">HMX발주금액 (￦)</label>
                                    <input type="text" class="form-control" id="hmxOrderAmount" th:field="*{hmxOrderAmount}" placeholder="금액 입력 시 ￦ 자동생성">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="status" class="form-label">상태</label>
                                    <select id="status" name="status" class="form-select" th:field="*{status}">
                                        <option value="">선택하세요</option>
                                        <option value="발주중">발주중</option>
                                        <option value="납품예정">납품예정</option>
                                        <option value="납품완료">납품완료</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="deliveryDate" class="form-label">납기</label>
                                    <input type="text" class="form-control" id="deliveryDate" th:field="*{deliveryDate}" placeholder="텍스트 입력">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="remark" class="form-label">비고</label>
                                    <input type="text" class="form-control" id="remark" th:field="*{remark}">
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <span th:text="${quotePart.id != null ? '수정' : '등록'}"></span>
                                </button>
                                <a href="/quote-parts" class="btn btn-secondary">취소</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    // Auto-format currency fields
    function bindCurrencyInput(input, prefix) {
        if (!input) return;

        // 초기 화면 진입 시 기존 값이 있다면 포맷팅 처리
        let initVal = input.value.replace(/[^0-9.]/g, '');
        if (initVal) {
            input.value = prefix + Number(initVal).toLocaleString();
        }

        input.addEventListener('blur', () => {
            let value = input.value.replace(/[^0-9.]/g, '');
            if (value) {
                input.value = prefix + Number(value).toLocaleString();
            }
        });
        
        input.addEventListener('focus', () => {
            // 수정 시 기호 및 쉼표 제거
            let value = input.value.replace(/[^0-9.]/g, '');
            input.value = value;
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Bind currency inputs
        const ccsPoAmountInput = document.getElementById('ccsPoAmount');
        const hmxOrderAmountInput = document.getElementById('hmxOrderAmount');
        
        if (ccsPoAmountInput) bindCurrencyInput(ccsPoAmountInput, '￥');
        if (hmxOrderAmountInput) bindCurrencyInput(hmxOrderAmountInput, '￦');

        // Form Submit 전처리: 통화 기호 및 쉼표(,) 제거 후 순수 숫자만 서버로 전송
        const form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', () => {
                [ccsPoAmountInput, hmxOrderAmountInput].forEach(input => {
                    if (input && input.value) {
                        input.value = input.value.replace(/[^0-9.]/g, '');
                    }
                });
            });
        }
    });
</script>
</body>
</html>
