<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{}, ~{::script})}"
      th:with="activePage='quoteParts'">
<head>
    <title th:text="${quotePart.id != null ? '견적 부품 수정 - MURATEC' : '견적 부품 추가 - MURATEC'}">Quote Part Form</title>
</head>
<body>
    <div class="content">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0" th:text="${quotePart.id != null ? '견적 부품 수정' : '견적 부품 추가'}"></h2>
                    </div>
                    <div class="card-body">
                        <form th:action="${quotePart.id != null ? '/quote-parts/' + quotePart.id : '/quote-parts'}"
                              th:object="${quotePart}"
                              method="post">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="quoteId" class="form-label">CCS견적번호</label>
                                    <select id="quoteId" name="quoteId" class="form-select">
                                        <option value="">선택하세요</option>
                                        <option th:each="q : ${quotes}" th:value="${q.id}"
                                                th:text="${q.ccsQuoteNo}"
                                                th:attr="data-factory-name=${q.jobRequest != null ? q.jobRequest.factoryName : ''}"
                                                th:selected="${quotePart.quote != null and quotePart.quote.id == q.id}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="partNo" class="form-label">품번</label>
                                    <input type="text" class="form-control" id="partNo" th:field="*{partNo}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="productName" class="form-label">제품명</label>
                                    <input type="text" class="form-control" id="productName" th:field="*{productName}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="productSpec" class="form-label">제품스펙</label>
                                    <input type="text" class="form-control" id="productSpec" th:field="*{productSpec}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="model" class="form-label">시리얼넘버</label>
                                    <input type="text" class="form-control" id="model" th:field="*{model}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="quoteQuantity" class="form-label">견적수량</label>
                                    <input type="number" class="form-control" id="quoteQuantity" th:field="*{quoteQuantity}">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="unitPriceBrt" class="form-label">Unitprice(BRT)</label>
                                    <input type="number" step="0.01" class="form-control" id="unitPriceBrt" th:field="*{unitPriceBrt}" oninput="window.updateUnitPriceHmx()">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="unitPriceHmx" class="form-label">Unitprice(HMX)</label>
                                    <input type="number" step="0.01" class="form-control" id="unitPriceHmx" th:value="${quotePart.unitPriceHmx}" readonly>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="brtRateId" class="form-label">BRT 환율/제비용</label>
                                    <select id="brtRateId" name="brtRateId" class="form-select">
                                        <option value="">선택안함</option>
                                        <option th:each="rate : ${marginValues}" th:value="${rate.id}"
                                                th:text="${rate.name}"
                                                th:selected="${(quotePart.brtMarginRate != null and quotePart.brtMarginRate.id == rate.id)
                                                              or (quotePart.brtExpenseRate != null and quotePart.brtExpenseRate.id == rate.id)
                                                              or (quotePart.brtMarginRate == null and quotePart.brtExpenseRate == null and quotePart.marginRate != null and quotePart.marginRate.id == rate.id)
                                                              or (quotePart.brtMarginRate == null and quotePart.brtExpenseRate == null and quotePart.expenseRate != null and quotePart.expenseRate.id == rate.id)}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="hmxRateId" class="form-label">HMX 환율/제비용</label>
                                    <select id="hmxRateId" name="hmxRateId" class="form-select">
                                        <option value="">선택안함</option>
                                        <option th:each="rate : ${marginValues}" th:value="${rate.id}"
                                                th:text="${rate.name}"
                                                th:selected="${(quotePart.hmxMarginRate != null and quotePart.hmxMarginRate.id == rate.id)
                                                              or (quotePart.hmxExpenseRate != null and quotePart.hmxExpenseRate.id == rate.id)}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="remark" class="form-label">비고</label>
                                    <input type="text" class="form-control" id="remark" th:field="*{remark}">
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <span th:text="${quotePart.id != null ? '수정' : '등록'}"></span>
                                </button>
                                <a href="/quote-parts" class="btn btn-secondary">취소</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.updateUnitPriceHmx = function () {
            const unitPriceBrtInput = document.getElementById('unitPriceBrt');
            const unitPriceHmxInput = document.getElementById('unitPriceHmx');
            const rawValue = unitPriceBrtInput.value.trim();

            if (rawValue === '') {
                unitPriceHmxInput.value = '';
                return;
            }

            const unitPriceBrt = Number(rawValue);
            if (Number.isNaN(unitPriceBrt)) {
                unitPriceHmxInput.value = '';
                return;
            }

            unitPriceHmxInput.value = (unitPriceBrt * 1.65).toFixed(2);
        };

        window.updateUnitPriceHmx();
    </script>
<script th:inline="javascript">
/*<![CDATA[*/
document.addEventListener('DOMContentLoaded', function() {
  var isAdd = /*[[${quotePart.id == null}]]*/ true;
  if (isAdd) {
    var brtSelect = document.getElementById('brtRateId');
    var hmxSelect = document.getElementById('hmxRateId');
    if (brtSelect && brtSelect.options.length > 1) brtSelect.selectedIndex = 1;
    if (hmxSelect && hmxSelect.options.length > 1) hmxSelect.selectedIndex = 2;
  }
});
/*]]>*/
</script>
</body>
</html>
