<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{}, ~{})}"
      th:with="activePage='quoteParts'">
<head>
    <title>견적 부품 관리 - BARATEC</title>
</head>
<body>
    <div class="content">
        <h1 class="mb-4 text-center">견적 부품 관리</h1>

        <div th:if="${quote != null}" class="alert alert-secondary">
            <strong>CCS견적번호:</strong> <span th:text="${quote.ccsQuoteNo}"></span>
        </div>

        <div class="mb-3 d-flex gap-2 align-items-center">
            <a th:href="@{/quote-parts/new(quoteId=${quoteId})}" class="btn btn-primary">새 부품 추가</a>
            <a href="/quote-parts/bulk" class="btn btn-success">📊 대량 등록</a>

            <form method="get" action="/quote-parts" class="ms-auto d-flex gap-2 align-items-center">
                <input type="hidden" name="quoteId" th:value="${quoteId}">
                <input type="text" name="q" class="form-control form-control-sm" placeholder="품번/제품명 검색"
                       th:value="${q}" style="width: 200px;">
                <button type="submit" class="btn btn-outline-secondary btn-sm">검색</button>
            </form>
        </div>

        <div th:if="${quoteParts.isEmpty()}" class="alert alert-info">
            등록된 부품이 없습니다.
        </div>

        <div th:if="${!quoteParts.isEmpty()}" class="table-responsive">
            <table class="table table-striped table-bordered table-hover">
                <thead>
                                    <tr>
                                        <th class="col-medium">CCS견적번호</th>
                                        <th class="col-medium">작번</th>
                                        <th class="col-medium">고객명</th>
                                        <th class="col-medium">공장명</th>
                                        <th class="col-medium">제품명</th>
                                        <th class="col-medium">품번/제품스펙</th>
                                        <th class="col-medium">CCS PO번호</th>
                                        <th class="col-medium">작번/시리얼넘버</th>
                                        <th class="col-medium">발주수량</th>
                                        <th class="col-medium">CCS PO금액 (￥)</th>
                                        <th class="col-medium">HMX발주번호</th>
                                        <th class="col-medium">HMX발주금액 (￦)</th>
                                        <th class="col-medium">상태</th>
                                        <th class="col-medium">납기</th>
                                        <th class="col-long">비고</th>
                                        <th class="col-short">관리</th>
                                    </tr>
                                </thead>
                <tbody>
                                    <tr th:each="item : ${quoteParts}">
                                        <td th:text="${item.quote != null ? item.quote.ccsQuoteNo : ''}"></td>
                                        <td th:text="${item.quote != null and item.quote.jobRequest != null ? item.quote.jobRequest.jobNo : ''}"></td>
                                        <td th:text="${item.quote != null and item.quote.jobRequest != null ? item.quote.jobRequest.customerName : ''}"></td>
                                        <td th:text="${item.quote != null and item.quote.jobRequest != null ? item.quote.jobRequest.factoryName : item.factoryName}"></td>
                                        <td th:text="${item.productName}"></td>
                                        <td th:text="${item.partNoProductSpec}"></td>
                                        <td th:text="${item.ccsPoNo}"></td>
                                        <td th:text="${item.workNoSerialNo}"></td>
                                        <td th:text="${item.orderQuantity}"></td>
                                        <td th:text="${item.ccsPoAmount}"></td>
                                        <td th:text="${item.hmxOrderNo}"></td>
                                        <td th:text="${item.hmxOrderAmount}"></td>
                                        <td th:text="${item.status}"></td>
                                        <td th:text="${item.deliveryDate}"></td>
                                        <td th:text="${item.remark}"></td>
                                        <td>
                                            <div class="d-flex gap-1 justify-content-center">
                                                <a th:href="@{/quote-parts/edit/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary px-2" title="수정" aria-label="수정">
                                                    <i class="bi bi-pencil-square"></i>
                                                </a>
                                                <a th:href="@{/quote-parts/delete/{id}(id=${item.id})}" class="btn btn-sm btn-outline-danger px-2" title="삭제" aria-label="삭제" onclick="return confirm('삭제하시겠습니까?');">
                                                    <i class="bi bi-trash"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
