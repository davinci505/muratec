<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{::style}, ~{::script})}"
      th:with="activePage='jobs'">
<head>
    <title>의뢰 대량 등록 - BARATEC</title>
    <style>
        .excel-table {
            width: 100%;
            overflow-x: auto;
        }
        .excel-table table {
            width: 100%;
            table-layout: fixed;
        }
        .excel-table input {
            width: 100%;
            font-size: 0.7rem;
            padding: 2px 4px;
            border: 1px solid #ccc;
        }
        .excel-table th {
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
            padding: 4px 2px;
            font-size: 0.65rem;
            white-space: normal;
            word-wrap: break-word;
            position: sticky;
            top: 0;
            z-index: 10;
            line-height: 1.2;
        }
        .excel-table td {
            padding: 1px;
            border: 1px solid #ddd;
        }
        .row-number {
            background-color: #ecf0f1;
            font-weight: bold;
            text-align: center;
            width: 30px;
            max-width: 30px;
            padding: 2px !important;
        }
        .btn-container {
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
            padding: 10px 0;
            margin-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }
        .table-container {
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }
        .row-number { width: 3% !important; }
        .col-medium { width: 8%; }
        .col-long { width: 10%; }
    </style>
</head>
<body>
    <div class="content">
        <div class="btn-container">
            <h2>고객의뢰 대량 등록</h2>
            <div class="d-flex gap-2 mt-2">
                <button class="btn btn-success" onclick="addRow()">+ 행 추가</button>
                <button class="btn btn-danger" onclick="removeLastRow()">- 마지막 행 삭제</button>
                <button class="btn btn-primary" onclick="saveAll()">전체 저장</button>
                <a href="/jobs" class="btn btn-secondary">취소</a>
                <div class="ms-auto">
                    <small class="text-muted">💡 Tip: 엑셀에서 복사한 데이터를 첫 번째 셀에 붙여넣으면 자동으로 입력됩니다</small>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="excel-table">
                <table class="table table-bordered" id="dataTable">
                    <thead>
                        <tr>
                            <th class="row-number">#</th>
                            <th class="col-medium">구분</th>
                            <th class="col-medium">작번</th>
                            <th class="col-medium">고객명</th>
                            <th class="col-medium">공장명</th>
                            <th class="col-medium">의뢰인</th>
                            <th class="col-medium">의뢰날짜</th>
                            <th class="col-medium">제품명</th>
                            <th class="col-long">제품스펙</th>
                            <th class="col-medium">품번</th>
                            <th class="col-medium">금액</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let rowCount = 0;

        window.onload = function() {
            for (let i = 0; i < 10; i++) {
                addRow();
            }
        };

        function addRow() {
            rowCount++;
            const tbody = document.getElementById('tableBody');
            const row = tbody.insertRow();

            row.innerHTML = `
                <td class="row-number">${rowCount}</td>
                <td>
                    <select class="form-select" name="division">
                        <option value="">선택</option>
                        <option value="현대무벡스">현대무벡스</option>
                        <option value="바라텍">바라텍</option>
                        <option value="기타">기타</option>
                    </select>
                </td>
                <td><input type="text" class="form-control" name="jobNo"></td>
                <td><input type="text" class="form-control" name="customerName"></td>
                <td><input type="text" class="form-control" name="factoryName"></td>
                <td><input type="text" class="form-control" name="requester"></td>
                <td><input type="text" class="form-control" name="requestDate" placeholder="YYYYMMDD" maxlength="10" pattern="\d{4}-\d{2}-\d{2}" inputmode="numeric"></td>
                <td><input type="text" class="form-control" name="productName"></td>
                <td><input type="text" class="form-control" name="productSpec"></td>
                <td><input type="text" class="form-control" name="partNo"></td>
                <td><input type="number" step="0.01" class="form-control" name="amount"></td>
            `;
        }

        function removeLastRow() {
            const tbody = document.getElementById('tableBody');
            if (tbody.rows.length > 0) {
                tbody.deleteRow(tbody.rows.length - 1);
                rowCount--;
            }
        }

        function formatDateValue(value) {
            const raw = (value || '').replace(/\D/g, '').slice(0, 8);
            if (raw.length !== 8) return raw;
            return raw.slice(0, 4) + '-' + raw.slice(4, 6) + '-' + raw.slice(6);
        }

        function parseAmountValue(value) {
            const raw = (value || '').trim();
            if (!raw) return null;
            const numeric = Number(raw.replace(/,/g, ''));
            return Number.isNaN(numeric) ? null : numeric;
        }

        function saveAll() {
            const rows = document.getElementById('tableBody').rows;
            const jobs = [];

            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];

                const division = (row.querySelector('[name="division"]')?.value || '').trim();
                const jobNo = (row.querySelector('[name="jobNo"]')?.value || '').trim();
                const customerName = (row.querySelector('[name="customerName"]')?.value || '').trim();
                const factoryName = (row.querySelector('[name="factoryName"]')?.value || '').trim();
                const requester = (row.querySelector('[name="requester"]')?.value || '').trim();
                const requestDate = (row.querySelector('[name="requestDate"]')?.value || '').trim();
                const productName = (row.querySelector('[name="productName"]')?.value || '').trim();
                const productSpec = (row.querySelector('[name="productSpec"]')?.value || '').trim();
                const partNo = (row.querySelector('[name="partNo"]')?.value || '').trim();
                const amount = (row.querySelector('[name="amount"]')?.value || '').trim();

                const isEmpty = !division && !jobNo && !customerName && !factoryName && !requester && !requestDate
                    && !productName && !productSpec && !partNo && !amount;
                if (isEmpty) continue;

                const job = {
                    division: division,
                    jobNo: jobNo,
                    customerName: customerName,
                    factoryName: factoryName,
                    requester: requester,
                    requestDate: formatDateValue(requestDate) || null,
                    productName: productName,
                    productSpec: productSpec,
                    partNo: partNo,
                    amount: parseAmountValue(amount)
                };

                jobs.push(job);
            }

            if (jobs.length === 0) {
                alert('저장할 데이터가 없습니다.');
                return;
            }

            fetch('/jobs/bulk', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(jobs)
            })
            .then(response => {
                if (response.ok) {
                    alert(jobs.length + '건이 저장되었습니다.');
                    window.location.href = '/jobs';
                } else {
                    alert('저장 중 오류가 발생했습니다.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('저장 중 오류가 발생했습니다.');
            });
        }

        document.addEventListener('paste', function(e) {
            const target = e.target;
            if (target.tagName !== 'INPUT') return;

            const pastedData = e.clipboardData.getData('text');
            if (!pastedData.includes('\t') && !pastedData.includes('\n')) return;

            e.preventDefault();

            const rows = pastedData.split('\n');
            const currentRow = target.closest('tr');
            const currentCell = target.closest('td');
            const startRowIndex = currentRow.rowIndex - 1;
            const startCellIndex = Array.from(currentRow.cells).indexOf(currentCell) - 1;

            const tbody = document.getElementById('tableBody');

            const neededRows = startRowIndex + rows.length;
            while (tbody.rows.length < neededRows) {
                addRow();
            }

            rows.forEach((row, rowOffset) => {
                const cells = row.split('\t');
                const targetRow = tbody.rows[startRowIndex + rowOffset];

                if (targetRow) {
                    const inputs = targetRow.getElementsByTagName('input');
                    cells.forEach((cellValue, cellOffset) => {
                        const targetInput = inputs[startCellIndex + cellOffset];
                        if (targetInput) {
                            targetInput.value = cellValue.trim();
                        }
                    });
                }
            });
        });

        document.addEventListener('keydown', function(e) {
            if (e.target.tagName !== 'INPUT') return;

            if (e.key === 'Tab') {
                e.preventDefault();
                const currentInput = e.target;
                const allInputs = Array.from(document.querySelectorAll('#tableBody input'));
                const currentIndex = allInputs.indexOf(currentInput);

                if (e.shiftKey) {
                    if (currentIndex > 0) {
                        allInputs[currentIndex - 1].focus();
                    }
                } else {
                    if (currentIndex < allInputs.length - 1) {
                        allInputs[currentIndex + 1].focus();
                    } else {
                        addRow();
                        setTimeout(() => {
                            const newInputs = document.querySelectorAll('#tableBody input');
                            newInputs[currentIndex + 1].focus();
                        }, 50);
                    }
                }
            }
        });

        document.addEventListener('input', function(e) {
            const target = e.target;
            if (target.tagName !== 'INPUT') return;
            if (target.name !== 'requestDate') return;
            target.value = target.value.replace(/\D/g, '').slice(0, 8);
        });

        document.addEventListener('blur', function(e) {
            const target = e.target;
            if (target.tagName !== 'INPUT') return;
            if (target.name !== 'requestDate') return;
            target.value = formatDateValue(target.value);
        }, true);
    </script>
</body>
</html>
