<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{::style}, ~{::script})}"
      th:with="activePage='formulas'">
<head>
    <title>계산법 관리 - BARATEC</title>
    <style>
        .tabulator-footer-contents { justify-content: center !important; }
        .tabulator-paginator { display: flex !important; justify-content: center !important; align-items: center !important; width: 100% !important; text-align: center !important; }
        .tabulator-paginator label { display: inline-flex !important; align-items: center !important; margin-right: 8px !important; margin-bottom: 0 !important; }
        .tabulator-page-size { display: inline-flex !important; align-items: center !important; margin: 0 8px !important; vertical-align: middle !important; }
        .tabulator-paginator .tabulator-page { display: inline-flex !important; align-items: center !important; justify-content: center !important; margin: 0 2px !important; }
        .tabulator-pages { display: inline-flex !important; align-items: center !important; margin: 0 8px !important; }
    </style>
</head>
<body>
    <div class="content">
        <h1 class="mb-4 text-center">계산법 관리</h1>

        <div class="mb-3 d-flex flex-wrap gap-2 align-items-center">
            <a href="/formulas/new" class="btn btn-primary">새 계산법 추가</a>
        </div>

        <div id="formulas-table"></div>
    </div>
</body>
<script th:inline="javascript">
    const table = new Tabulator("#formulas-table", {
        layout: "fitColumns",
        ajaxURL: "/api/formulas",
        ajaxResponse: function(url, params, response) {
            // 서버는 { data: [...], last_page: N } 형태로 응답하므로 data 배열만 반환
            return response && Array.isArray(response.data) ? response.data : response;
        },
        columns: [
            { title: "코드", field: "code", width: 180 },
            { title: "설명", field: "description", minWidth: 200,
              formatter: function(cell) {
                  const v = cell.getValue();
                  if (v == null || v === '') return '<span class="text-muted">-</span>';
                  return escapeHtml(v);
              }
            },
            {
                title: "항목",
                field: "items",
                minWidth: 260,
                formatter: function(cell) {
                    const items = cell.getValue() || [];
                    if (items.length === 0) return '<span class="text-muted">-</span>';
                    return items
                        .slice()
                        .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0))
                        .map(i => `${escapeHtml(i.itemName || i.itemKey)}(${i.multiplier})`)
                        .join(', ');
                }
            },
            {
                title: "관리",
                field: "actions",
                width: 110,
                hozAlign: "center",
                formatter: function(cell) {
                    const id = cell.getRow().getData().id;
                    return `
                        <div class="d-flex gap-1 justify-content-center">
                            <a href="/formulas/edit/${id}" class="btn btn-sm btn-outline-primary px-2" title="수정">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a href="/formulas/delete/${id}" class="btn btn-sm btn-outline-danger px-2" title="삭제" onclick="return confirm('삭제하시겠습니까?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    `;
                }
            }
        ],
        initialSort: [{ column: "code", dir: "asc" }],
        locale: true,
        langs: {
            "ko": {
                "pagination": {
                    "first": "처음", "first_title": "첫 페이지",
                    "last": "마지막", "last_title": "마지막 페이지",
                    "prev": "이전", "prev_title": "이전 페이지",
                    "next": "다음", "next_title": "다음 페이지",
                    "all": "전체"
                }
            }
        }
    });

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
</script>
</html>
