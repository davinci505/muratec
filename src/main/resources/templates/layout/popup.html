<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content, styles, scripts)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">BARATEC Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <!-- Tabulator v5 CSS (Bootstrap 5 theme) -->
    <link href="https://unpkg.com/tabulator-tables@5.5/dist/css/tabulator_bootstrap5.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Nanum Gothic", sans-serif;
            font-size: 0.75rem;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }

        .popup-content {
            padding: 20px;
            max-width: 100%;
        }

        /* 기존 테이블 스타일 */
        .table-responsive {
            overflow-x: auto;
        }

        .table {
            width: 100%;
            table-layout: fixed;
        }

        .table th {
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
            padding: 4px 2px;
            font-size: 0.65rem;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.2;
        }

        .table td {
            font-size: 0.7rem;
            padding: 4px 2px;
            word-wrap: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-id {
            width: 2%;
        }

        .col-short {
            width: 4.5%;
        }

        .col-medium {
            width: 6%;
        }

        .col-long {
            width: 7.5%;
        }

        .col-desc {
            width: 11%;
        }

        .highlight {
            background-color: #ffff00;
            font-weight: bold;
            padding: 2px;
        }
    </style>
    <th:block th:replace="${styles}"></th:block>
</head>

<body>
    <div class="popup-content">
        <th:block th:replace="${content}"></th:block>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tabulator v5 JS - global script -->
    <script src="https://unpkg.com/tabulator-tables@5.5/dist/js/tabulator.min.js"></script>
    <th:block th:replace="${scripts}"></th:block>
</body>
</html>
