<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{::style}, ~{::script})}"
      th:with="activePage='quotes'">
<head>
    <title th:text="${quote.id != null ? '견적 수정 - BARATEC' : '새 견적 추가 - BARATEC'}">Quote Form</title>
    <style>
        /* Tabulator custom styles for parts table */
        #jobRequestPartsTable {
            min-height: 200px;
        }
        .tabulator-row .tabulator-cell {
            vertical-align: middle;
        }
        .btn-delete-part {
            padding: 0.15rem 0.4rem;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0" th:text="${quote.id != null ? '견적 수정' : '새 견적 추가'}"></h2>
                    </div>
                    <div class="card-body">
                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                        <form th:action="${quote.id != null ? '/quotes/' + quote.id : '/quotes'}"
                              th:object="${quote}"
                              method="post">

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label for="jobRequestId" class="form-label">고객의뢰 선택</label>
                                    <select id="jobRequestId" name="jobRequestId" class="form-select">
                                        <option value="">선택하세요</option>
                                        <option th:each="job : ${jobs}" th:value="${job.id}"
                                                th:text="${job.division + ' / ' + job.requestNo + ' / ' + job.customerName + ' / ' + job.requester + ' / ' + job.requestDate}" 
                                                th:selected="${quote.jobRequest != null and quote.jobRequest.id == job.id}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                                            <div class="col-md-4 mb-3">
                                                                <label for="jobrequestDate" class="form-label">Muratec 의뢰날짜</label>
                                                                 <input type="text" class="form-control" id="jobrequestDate" th:field="*{jobrequestDate}" placeholder="YYYYMMDD" maxlength="10" pattern="\d{4}-\d{2}-\d{2}" inputmode="numeric"
                                                                     th:classappend="${#fields.hasErrors('jobrequestDate')} ? ' is-invalid' : ''">
                                                                <div class="invalid-feedback">YYYY-MM-DD 형식으로 입력하세요.</div>
                                                            </div>
                                                            <div class="col-md-4 mb-3">
                                                                <label for="jobRequestNo" class="form-label">Muratec작번</label>
                                                                <input type="text" class="form-control" id="jobRequestNo" th:field="*{jobRequestNo}">
                                                            </div>
                                                            <div class="col-md-4 mb-3">
                                                                <label for="ccsAmount" class="form-label">Muratec 견적금액 (￥)</label>
                                                                <input type="text" class="form-control" id="ccsAmount" th:field="*{ccsAmount}" placeholder="금액 입력 시 ￥ 자동생성">
                                                            </div>
                                                        </div>

                                                        

                                                        <div class="row">
                                                            <div class="col-md-4 mb-3">
                                                                <label for="brtQuoteDate" class="form-label">BRT견적날짜</label>
                                                                 <input type="text" class="form-control" id="brtQuoteDate" th:field="*{brtQuoteDate}" placeholder="YYYYMMDD" maxlength="10" pattern="\d{4}-\d{2}-\d{2}" inputmode="numeric"
                                                                     th:classappend="${#fields.hasErrors('brtQuoteDate')} ? ' is-invalid' : ''">
                                                                <div class="invalid-feedback">YYYY-MM-DD 형식으로 입력하세요.</div>
                                                            </div>
                                                            <div class="col-md-4 mb-3">
                                                                <label for="brtQuoteNo" class="form-label">BRT견적번호</label>
                                                                <input type="text" class="form-control" id="brtQuoteNo" th:field="*{brtQuoteNo}">
                                                            </div>
                                                            <div class="col-md-4 mb-3">
                                                                <label for="brtAmount" class="form-label">BRT견적금액 (￦)</label>
                                                                <input type="text" class="form-control" id="brtAmount" th:field="*{brtAmount}" placeholder="금액 입력 시 ￦ 자동생성">
                                                            </div>
                                                        </div>

                                                        <div class="row">
                                                            <div class="col-md-8 mb-3">
                                                                <label for="status" class="form-label">상태</label>
                                                                <select id="status" class="form-select" th:field="*{status}"
                                                                        th:classappend="${statusError} ? ' is-invalid' : ''" required>
                                                                    <option value="">선택하세요</option>
                                                                    <option th:each="s : ${statusOptions}" th:value="${s}" th:text="${s}"></option>
                                                                </select>
                                                                <div class="invalid-feedback">상태를 선택하세요.</div>
                                                            </div>

                                                            <div class="col-md-4 mb-3">
                                                                <label for="brtNegotiatedAmount" class="form-label">BRT네고금액</label>
                                                                <input type="text" class="form-control" id="brtNegotiatedAmount" th:field="*{brtNegotiatedAmount}" placeholder="텍스트 입력">
                                                            </div>
                                                        </div>

                                                        <div class="mb-3">
                                                            <label for="description" class="form-label">내역</label>
                                                            <textarea class="form-control" id="description" th:field="*{description}" rows="2"></textarea>
                                                        </div>

                            <!-- 의뢰부품목록 표시 영역 (Tabulator) -->
                            <div id="jobRequestPartsSection" class="mb-4" style="display: none;">
                                <div class="card">
                                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                                        <h5 class="mb-0">의뢰부품목록</h5>
                                        <div class="d-flex gap-2">
                                            <button type="button" class="btn btn-outline-success btn-sm" id="btn-fill-amounts" onclick="recalcAmountTotals()">
                                                <i class="bi bi-calculator"></i> 견적금액 입력
                                            </button>
                                            <button type="button" class="btn btn-outline-info btn-sm" id="btn-toggle-krw" onclick="toggleKrwView()" aria-pressed="false">
                                                <i class="bi bi-currency-exchange"></i> 원화보기
                                            </button>
                                            <button type="button" class="btn btn-outline-primary btn-sm" id="btn-add-part" onclick="openPartPopup()">
                                                <i class="bi bi-plus-circle"></i> 부품 추가
                                            </button>
                                        </div>
                                    </div>
                                    <div class="card-body p-0">
                                        <div id="jobRequestPartsTable"></div>
                                        <!-- Hidden input to store parts data as JSON -->
                                        <input type="hidden" name="partsJson" id="partsJson" value="">
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <span th:text="${quote.id != null ? '수정' : '등록'}"></span>
                                </button>
                                <a href="/quotes" class="btn btn-secondary">취소</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script th:inline="javascript">
    /*<![CDATA[*/
    // IIFE로 스코프를 분리하여 동일 변수 재선언 문제를 방지한다.
    (function () {
        const errorMessage = /*[[${errorMessage}]]*/ null;
        if (errorMessage) {
            alert(errorMessage);
        }

        // Initialize parts data from server-side model (JobRequest parts for new quotes)
        // 단일 삼항 표현으로 th:if 분기 제거 → 중복 const 선언 방지
        const initialParts = /*[[${quote.jobRequest != null ? quote.jobRequest.parts : null}]]*/ [];

        // Check if we're editing an existing quote
        const isEditing = /*[[${quote.id != null}]]*/ false;

        // Get quote ID for edit mode
        const quoteId = /*[[${quote.id}]]*/ null;

        // Initial JobRequest metadata (used on page load when a JobRequest is
        // already pre-selected, e.g. /quotes/new?jobId=...). These feed the
        // auto-population of CCS 견적날짜 / CCS 견적번호.
        const initialJobRequestNo = /*[[${quote.jobRequest?.requestNo}]]*/ null;
        const initialJobRequestDate = /*[[${quote.jobRequest?.requestDate}]]*/ null;

        // Expose to global scope so the second <script> block can use them
        // (non-strict <script> 태그는 bare 식별자를 window 통해 해석한다).
        window.errorMessage = errorMessage;
        window.initialParts = initialParts;
        window.isEditing = isEditing;
        window.quoteId = quoteId;
        window.initialJobRequestNo = initialJobRequestNo;
        window.initialJobRequestDate = initialJobRequestDate;
        // 원화보기 토글 상태 초기값. toggleKrwView()와 Tabulator formatter가 참조한다.
        window.isKrwView = false;
    })();
    /*]]>*/
</script>
<script>
    const datePattern = /^\d{4}-\d{2}-\d{2}$/;

    // YYYYMMDD 또는 YYYY-MM-DD 입력 형태를 YYYY-MM-DD로 정규화
    function formatDateInput(input) {
        if (!input) return;
        const raw = (input.value || '').replace(/\D/g, '').slice(0, 8);
        if (raw.length === 8) {
            input.value = raw.slice(0, 4) + '-' + raw.slice(4, 6) + '-' + raw.slice(6);
        }
    }

    function setTodayIfEmpty(input) {
        if (!input || input.value) return;
        const now = new Date();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        input.value = `${now.getFullYear()}-${month}-${day}`;
    }

    function isValidDateValue(value) {
        if (!datePattern.test(value)) {
            return false;
        }
        const parts = value.split('-').map(Number);
        const year = parts[0];
        const month = parts[1];
        const day = parts[2];
        const date = new Date(year, month - 1, day);
        return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
    }

    function validateDateInput(input) {
        if (!input) return true;
        const value = (input.value || '').trim();
        const isValid = value === '' || isValidDateValue(value);
        input.classList.toggle('is-invalid', !isValid);
        return isValid;
    }

    /**
     * Auto-populate CCS 견적날짜 / CCS 견적번호 from the selected JobRequest.
     * - Edit mode: no-op (preserves existing CCS values).
     * - Both target fields must be empty; existing user input is preserved.
     * - requestDate (YYYY-MM-DD) is taken from JobRequest.requestDate and is
     *   already in the expected format, so we set the value directly.
     */
    function applyCcsFromJobRequestData(requestNo, requestDate) {
        if (isEditing) return;

        const jobrequestDateInput = document.getElementById('jobrequestDate');
        const jobRequestNoInput = document.getElementById('jobRequestNo');
        if (!jobrequestDateInput || !jobRequestNoInput) return;

        const jobrequestDateEmpty = !jobrequestDateInput.value || !jobrequestDateInput.value.trim();
        const jobRequestNoEmpty = !jobRequestNoInput.value || !jobRequestNoInput.value.trim();

        if (jobrequestDateEmpty ) {
            if (requestDate) {
                jobrequestDateInput.value = requestDate;
                validateDateInput(jobrequestDateInput);
            }
        }

        if ( jobRequestNoEmpty){
            if (requestNo) {
                jobRequestNoInput.value = requestNo;
            }
        }
    }

    function bindDateInput(input) {
        if (!input) return;
        // Blur 시점에 자동 하이픈 생성 및 유효성 검사
        input.addEventListener('blur', () => {
            formatDateInput(input);
            validateDateInput(input);
        });
    }

    function bindCurrencyInput(input, prefix) {
        if (!input) return;
        
        // 초기 로드 시 값 포맷팅
        let initVal = input.value.replace(/[^0-9.]/g, '');
        if (initVal) {
            input.value = prefix + Number(initVal).toLocaleString();
        }

        input.addEventListener('blur', () => {
            let value = input.value.replace(/[^0-9.]/g, '');
            if (value) {
                input.value = prefix + Number(value).toLocaleString();
            }
        });

        input.addEventListener('focus', () => {
            let value = input.value.replace(/[^0-9.]/g, '');
            input.value = value;
        });
    }

    // Tabulator table for job request parts
    let partsTable;
    let partPopupWindow = null;

    // /api/formulas 조회 결과를 세션 단위로 캐시한다. recalcAmountTotals()와 toggleKrwView()
    // 양쪽에서 동일 데이터를 사용하므로, 한 번만 fetch하고 이후 호출은 캐시를 재사용한다.
    // - null: 아직 fetch 하지 않음
    // - object: 마지막 fetch 응답(payload)
    let formulasCache = null;
    let formulasCachePromise = null;

    document.addEventListener('DOMContentLoaded', () => {
        // Auto-fill today's date only for BRT견적날짜.
        // CCS견적날짜는 자동 채움하지 않음 (요청에 따라 제거).
        setTodayIfEmpty(document.getElementById('brtQuoteDate'));

        const dateInputs = [
            document.getElementById('jobrequestDate'),
            document.getElementById('brtQuoteDate')
        ];

        dateInputs.forEach(input => {
            bindDateInput(input);
            validateDateInput(input);
        });

        const ccsAmountInput = document.getElementById('ccsAmount');
        const brtAmountInput = document.getElementById('brtAmount');
        if (ccsAmountInput) bindCurrencyInput(ccsAmountInput, '￥');
        if (brtAmountInput) bindCurrencyInput(brtAmountInput, '￦');

        // Initialize parts Tabulator
        initPartsTable();

        // Job Request Parts loading functionality
        const jobRequestSelect = document.getElementById('jobRequestId');
        const partsSection = document.getElementById('jobRequestPartsSection');

        async function loadJobRequestParts(jobRequestId) {
            // In edit mode, don't fetch JobRequest parts via API (existingQuoteParts are already loaded in tableBuilt)
            // But still handle section visibility for new mode
            if (isEditing) {
                return;
            }
            
            if (!jobRequestId) {
                partsSection.style.display = 'none';
                if (partsTable) {
                    partsTable.setData([]);
                }
                return;
            }

            // Show loading state
            partsSection.style.display = 'block';
            
            // Show loading in Tabulator
            if (partsTable) {
                partsTable.setData([]); // Clear existing data
            }

            try {
                const response = await fetch(`/quotes/api/job-request-parts?jobRequestId=${jobRequestId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch parts');
                }
                const data = await response.json();

                // Auto-populate CCS 견적날짜 / CCS 견적번호 from JobRequest metadata
                if (data) {
                    applyCcsFromJobRequestData(data.requestNo, data.requestDate);
                }

                const parts = data && data.parts ? data.parts : [];

                if (parts && parts.length > 0) {
                    const partsData = parts.map((part, index) => ({
                        partName: part.partName,
                        partNumber: part.partNumber,
                        spec: part.spec,
                        priceJpy: part.priceJpy,
                        quantity: part.quantity || 1,
                        sortOrder: part.sortOrder !== undefined ? part.sortOrder : index
                    })).map(applyPriceCalculations);
                    if (partsTable) {
                        partsTable.setData(partsData);
                    }
                } else {
                    if (partsTable) {
                        partsTable.setData([]);
                    }
                }
            } catch (error) {
                console.error('Error loading job request parts:', error);
                if (partsTable) {
                    partsTable.setData([]);
                }
            }
        }

        if (jobRequestSelect) {
            jobRequestSelect.addEventListener('change', (event) => {
                const jobRequestId = event.target.value;
                loadJobRequestParts(jobRequestId ? parseInt(jobRequestId) : null);
            });

            // Load parts on page load if job request is already selected (only for new quotes)
            if (!isEditing && jobRequestSelect.value) {
                loadJobRequestParts(parseInt(jobRequestSelect.value));
            }
        }

        const form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', (event) => {
                let isValid = true;

                // 1. 날짜 데이터 최종 포맷팅 및 검증
                dateInputs.forEach(input => {
                    if (input) {
                        formatDateInput(input);
                        if (!validateDateInput(input)) {
                            isValid = false;
                        }
                    }
                });

                if (!isValid) {
                    alert('날짜 형식이 올바르지 않습니다. YYYY-MM-DD 형식으로 입력하세요.');
                    event.preventDefault();
                    return;
                }

                // 2. 제출 전 통화 기호 및 쉼표(,) 제거 (숫자만 서버로 전달)
                [ccsAmountInput, brtAmountInput].forEach(input => {
                    if (input && input.value) {
                        input.value = input.value.replace(/[^0-9.]/g, '');
                    }
                });

                // 3. Serialize parts table data to hidden input before submit
                if (partsTable) {
                    const partsData = partsTable.getData().map(row => ({
                        partName: row.partName,
                        partNumber: row.partNumber,
                        spec: row.spec,
                        quantity: row.quantity,
                        sortOrder: row.sortOrder,
                        purchasePrice: row.purchasePrice,
                        sellingPrice: row.sellingPrice
                    }));
                    document.getElementById('partsJson').value = JSON.stringify(partsData);
                }
            });
        }
    });

    function loadQuoteParts() {
            if (!isEditing) return;
            
            if (!quoteId) return;
            
            fetch(`/quotes/api/quote-parts/${quoteId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch quote parts');
                    }
                    return response.json();
                })
                .then(parts => {
                    if (parts && parts.length > 0) {
                        const partsToLoad = parts.map((part, index) => ({
                            partName: part.partName,
                            partNumber: part.partNumber,
                            spec: part.spec,
                            priceJpy: part.priceJpy,
                            quantity: part.quantity || 1,
                            sortOrder: part.sortOrder !== undefined ? part.sortOrder : index
                        })).map(applyPriceCalculations);
                        partsTable.setData(partsToLoad);

                        // Show parts section
                        const partsSection = document.getElementById('jobRequestPartsSection');
                        if (partsSection) {
                            partsSection.style.display = 'block';
                        }
                    }
                })
                .catch(error => {
                    console.error('Error loading quote parts:', error);
                });
        }

    function initPartsTable() {
        partsTable = new Tabulator("#jobRequestPartsTable", {
            layout: "fitColumns",
            height: "300px",
            placeholder: "추가된 부품이 없습니다. '부품 추가' 버튼을 클릭하세요.",
            columns: [
                { title: "부품명", field: "partName", editor: false },
                { title: "품번", field: "partNumber", editor: false },
                { title: "스펙", field: "spec", editor: false },
                { title: "수량", field: "quantity", width: 80, hozAlign: "center",
                  editor: "number",
                  editorParams: { min: 1, step: 1 },
                  validator: ["min:1", "integer"]
                },
                { title: "부품가격(￥)", field: "priceJpy", width: 110, hozAlign: "right", editor: false,
                  formatter: function(cell) {
                      const rowData = cell.getRow().getData();
                      const v = window.isKrwView ? rowData.priceKrw : cell.getValue();
                      if (v === null || v === undefined || v === '') return '';
                      return (window.isKrwView ? '￦' : '') + Number(v).toLocaleString();
                  }
                },
                { title: "매입가(￥)", field: "purchasePrice", width: 120, hozAlign: "right", editor: false,
                  formatter: function(cell) {
                      const rowData = cell.getRow().getData();
                      const v = window.isKrwView ? rowData.purchaseKrw : cell.getValue();
                      if (v === null || v === undefined || v === '') return '';
                      return (window.isKrwView ? '￦' : '') + Number(v).toLocaleString();
                  }
                },
                { title: "공급가(￥)", field: "sellingPrice", width: 120, hozAlign: "right", editor: false,
                  formatter: function(cell) {
                      const rowData = cell.getRow().getData();
                      const v = window.isKrwView ? rowData.sellingKrw : cell.getValue();
                      if (v === null || v === undefined || v === '') return '';
                      return (window.isKrwView ? '￦' : '') + Number(v).toLocaleString();
                  }
                },
                { title: "삭제", field: "delete", width: 60, hozAlign: "center",
                  formatter: function(cell) {
                                      const partNumber = cell.getRow().getData().partNumber;
                                      return '<button class="btn btn-sm btn-outline-danger btn-delete-part" onclick="deletePartByPartNumber(\'' + partNumber + '\')"><i class="bi bi-trash"></i></button>';
                                  }
                                }
            ],
            initialSort: [{ column: "sortOrder", dir: "asc" }],
            locale: true,
            langs: {
                "ko": {
                    "pagination": {
                        "first": "처음", "first_title": "첫 페이지",
                        "last": "마지막", "last_title": "마지막 페이지",
                        "prev": "이전", "prev_title": "이전 페이지",
                        "next": "다음", "next_title": "다음 페이지",
                        "all": "전체"
                    }
                }
            }
        });

        // Load initial parts data
        if (isEditing) {
            // EDIT MODE: Fetch QuoteParts via AJAX endpoint
            loadQuoteParts();
        } else {
            // NEW MODE: Use initialParts from JobRequest (if job request is selected)
            if (initialParts && initialParts.length > 0) {
                const partsToLoad = initialParts.map((part, index) => ({
                    partName: part.partName,
                    partNumber: part.partNumber,
                    spec: part.spec,
                    priceJpy: part.priceJpy,
                    quantity: part.quantity || 1,
                    sortOrder: part.sortOrder !== undefined ? part.sortOrder : index
                })).map(applyPriceCalculations);
                partsTable.setData(partsToLoad);

                // Show parts section
                const partsSection = document.getElementById('jobRequestPartsSection');
                if (partsSection) {
                    partsSection.style.display = 'block';
                }
            }
        }

        // Update sortOrder when rows are moved
        partsTable.on("rowMoved", function(row) {
            updateSortOrders();
        });

        // Live recalculation: observe the table for new <input> elements
        // (created when a cell becomes editable) and recompute the price
        // cells on every keystroke / spinner click of the quantity input.
        // 원화보기 모드에서는 KRW 임시 필드도 함께 갱신해야 화면의 금액 셀이
        // 수량 변경에 즉시 반응한다. fetch가 필요한 경우 recalcRowPrices와 동일하게
        // 비동기로 multiplier를 가져온 뒤 KRW 필드를 채운다.
        const recomputeFor = (row, qty) => {
            const data = row.getData();
            const priceJpy = Number(data.priceJpy) || 0;
            const safeQty = Number.isFinite(qty) && qty > 0 ? qty : 0;
            let purchasePrice = null;
            let sellingPrice = null;
            if (priceJpy > 0 && safeQty > 0) {
                purchasePrice = Math.round(priceJpy * safeQty);
                sellingPrice = Math.round(safeQty * priceJpy * SELLING_MULTIPLIER_FACTOR);
            }
            if (data.purchasePrice !== purchasePrice || data.sellingPrice !== sellingPrice) {
                row.update({ purchasePrice: purchasePrice, sellingPrice: sellingPrice });
            }
            if (window.isKrwView) {
                const krwUpdate = { purchasePrice: purchasePrice, sellingPrice: sellingPrice };
                const hasMult = formulasCache && formulasCache.__purchaseMult != null && formulasCache.__sellingMult != null;
                if (hasMult) {
                    applyKrwFieldsToRow(row, krwUpdate);
                    rerenderPriceCells();
                } else {
                    row.update({ priceKrw: null, purchaseKrw: null, sellingKrw: null });
                    rerenderPriceCells();
                    fetchFormulasCached()
                        .then(payload => {
                            const formulas = (payload && Array.isArray(payload.data)) ? payload.data : [];
                            const purchaseFormula = formulas.find(f => matchesFormula(f, '바라텍'));
                            const sellingFormula = formulas.find(f => matchesFormula(f, '무라텍'));
                            if (!purchaseFormula || !sellingFormula) {
                                return;
                            }
                            rememberFormulaMultipliers(
                                multiplyFormulaItems(purchaseFormula.items),
                                multiplyFormulaItems(sellingFormula.items)
                            );
                            applyKrwFieldsToRow(row, krwUpdate);
                            rerenderPriceCells();
                        })
                        .catch(err => {
                            console.error('recomputeFor formulas fetch error:', err);
                        });
                }
            }
        };

        const tableEl = document.getElementById('jobRequestPartsTable');
        if (tableEl) {
            const mo = new MutationObserver((mutations) => {
                for (const m of mutations) {
                    for (const node of m.addedNodes) {
                        if (node.nodeType !== 1) continue;
                        // Find all inputs in the added subtree
                        const inputs = node.matches && node.matches('input')
                            ? [node]
                            : (node.querySelectorAll ? Array.from(node.querySelectorAll('input')) : []);
                        for (const input of inputs) {
                            if (input.dataset.liveRecalcBound === '1') continue;
                            const cellEl = input.closest('.tabulator-cell');
                            if (!cellEl) continue;
                            const field = cellEl.getAttribute('tabulator-field');
                            if (field !== 'quantity') continue;
                            input.dataset.liveRecalcBound = '1';
                            // Find the row by walking up to .tabulator-row and matching
                            const rowEl = input.closest('.tabulator-row');
                            if (!rowEl) continue;
                            const row = partsTable.getRows().find(r => r.getElement() === rowEl);
                            if (!row) continue;
                            const handler = () => {
                                const qty = parseInt(input.value, 10);
                                recomputeFor(row, qty);
                            };
                            input.addEventListener('input', handler);
                            handler();
                        }
                    }
                }
            });
            mo.observe(tableEl, { childList: true, subtree: true });
        }

        // Final commit: ensure prices reflect the persisted quantity value
        // (e.g. after Enter / blur / arrow-key adjustment).
        partsTable.on("dataEdited", function(cell) {
            if (cell.getField() === 'quantity') {
                recalcRowPrices(cell.getRow());
                updateSortOrders();
            }
        });
    }

    // Price calculation constants
    const SELLING_MULTIPLIER_FACTOR = 1.65;

    /**
     * Apply purchasePrice and sellingPrice calculations to a row data object.
     * Returns a new object with computed price fields.
     * - purchasePrice = priceJpy * quantity
     * - sellingPrice  = quantity * priceJpy * 1.65
     */
    function applyPriceCalculations(row) {
        const qty = Number(row.quantity) || 0;
        const priceJpy = Number(row.priceJpy) || 0;
        if (priceJpy > 0 && qty > 0) {
            const purchasePrice = priceJpy * qty;
            const sellingPrice = qty * priceJpy * SELLING_MULTIPLIER_FACTOR;
            row.purchasePrice = Math.round(purchasePrice);
            row.sellingPrice = Math.round(sellingPrice);
        } else {
            row.purchasePrice = row.purchasePrice || null;
            row.sellingPrice = row.sellingPrice || null;
        }
        return row;
    }

    /**
     * Recalculate purchasePrice and sellingPrice for a given Tabulator row.
     * 원화보기 모드(isKrwView)인 경우 priceJpy 변화에 따라 KRW 임시 필드도 함께 갱신한다.
     *
     * 캐시(__purchaseMult/__sellingMult)에 multiplier가 없으면 fetchFormulasCached()로
     * 즉시 가져온 뒤 KRW 필드를 채운다. 이로써 "엔화보기를 한 번도 누르지 않은 상태에서
     * 곧바로 원화보기 → 수량 변경" 시나리오에서도 KRW 셀이 stale 상태로 남지 않는다.
     */
    function recalcRowPrices(row) {
        const data = row.getData();
        const qty = Number(data.quantity) || 0;
        const priceJpy = Number(data.priceJpy) || 0;
        const update = {};
        if (priceJpy > 0 && qty > 0) {
            update.purchasePrice = Math.round(priceJpy * qty);
            update.sellingPrice = Math.round(qty * priceJpy * SELLING_MULTIPLIER_FACTOR);
        } else {
            update.purchasePrice = null;
            update.sellingPrice = null;
        }
        row.update(update);

        if (window.isKrwView) {
            const hasMult = formulasCache && formulasCache.__purchaseMult != null && formulasCache.__sellingMult != null;
            if (hasMult) {
                applyKrwFieldsToRow(row, update);
                rerenderPriceCells();
            } else {
                // 캐시가 비어있으면 fetch 후 multiplier를 캐시에 저장 → KRW 필드 주입 → 재렌더.
                // row는 이미 JPY 값으로 갱신된 상태이므로, fetch 도중 KRW 셀이 stale JPY 값으로
                // 보이지 않도록 우선 KRW 임시 필드를 null로 비워 stale 상태를 방지한다.
                row.update({ priceKrw: null, purchaseKrw: null, sellingKrw: null });
                rerenderPriceCells();
                fetchFormulasCached()
                    .then(payload => {
                        const formulas = (payload && Array.isArray(payload.data)) ? payload.data : [];
                        const purchaseFormula = formulas.find(f => matchesFormula(f, '바라텍'));
                        const sellingFormula = formulas.find(f => matchesFormula(f, '무라텍'));
                        if (!purchaseFormula || !sellingFormula) {
                            return;
                        }
                        rememberFormulaMultipliers(
                            multiplyFormulaItems(purchaseFormula.items),
                            multiplyFormulaItems(sellingFormula.items)
                        );
                        // 캐시 적용 후 KRW 필드 다시 주입 + 재렌더.
                        applyKrwFieldsToRow(row, update);
                        rerenderPriceCells();
                    })
                    .catch(err => {
                        console.error('recalcRowPrices formulas fetch error:', err);
                    });
            }
        }
    }

    /**
     * 원화보기 모드일 때 주어진 row에 KRW 임시 필드(priceKrw/purchaseKrw/sellingKrw)를
     * 계산해 주입한다. formulasCache가 비어있으면 임시 필드를 null로 유지한다.
     *
     * @param {Tabulator.Row} row    대상 행
     * @param {Object} [overrides]   이미 계산된 purchasePrice/sellingPrice 등이 있으면 그 값을 우선 사용
     */
    function applyKrwFieldsToRow(row, overrides) {
        if (!row) return;
        const d = row.getData() || {};
        const purchaseMult = (formulasCache && (formulasCache.__purchaseMult != null))
            ? formulasCache.__purchaseMult
            : null;
        const sellingMult = (formulasCache && (formulasCache.__sellingMult != null))
            ? formulasCache.__sellingMult
            : null;

        const fields = {};
        if (purchaseMult != null) {
            const pj = Number(d.priceJpy);
            fields.priceKrw = Number.isFinite(pj) ? Math.round(pj * purchaseMult) : null;
        }
        if (overrides) {
            if ('purchasePrice' in overrides) {
                const pp = Number(overrides.purchasePrice);
                fields.purchaseKrw = (purchaseMult != null && Number.isFinite(pp)) ? Math.round(pp * purchaseMult) : null;
            }
            if ('sellingPrice' in overrides) {
                const sp = Number(overrides.sellingPrice);
                fields.sellingKrw = (sellingMult != null && Number.isFinite(sp)) ? Math.round(sp * sellingMult) : null;
            }
        } else {
            if (purchaseMult != null) {
                const pp = Number(d.purchasePrice);
                fields.purchaseKrw = Number.isFinite(pp) ? Math.round(pp * purchaseMult) : null;
            }
            if (sellingMult != null) {
                const sp = Number(d.sellingPrice);
                fields.sellingKrw = Number.isFinite(sp) ? Math.round(sp * sellingMult) : null;
            }
        }
        row.update(fields);
    }

    /**
     * formulasCache에 미리 계산된 multiplier를 저장해 두는 헬퍼. toggleKrwView() 성공 시
     * 한 번 호출되며, 이후 applyKrwFieldsToRow()가 비동기 fetch 없이 즉시 KRW 값을 계산한다.
     */
    function rememberFormulaMultipliers(purchaseMult, sellingMult) {
        if (!formulasCache) formulasCache = {};
        formulasCache.__purchaseMult = purchaseMult;
        formulasCache.__sellingMult = sellingMult;
    }

    /**
     * /api/formulas 응답을 한 번만 fetch하고 이후 호출에서는 캐시된 payload를 재사용한다.
     * 진행 중인 fetch가 있으면 그 promise를 그대로 반환해 중복 네트워크 요청을 방지한다.
     */
    function fetchFormulasCached() {
        if (formulasCache) {
            return Promise.resolve(formulasCache);
        }
        if (formulasCachePromise) {
            return formulasCachePromise;
        }
        formulasCachePromise = fetch('/api/formulas')
            .then(resp => {
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                return resp.json();
            })
            .then(payload => {
                formulasCache = payload;
                formulasCachePromise = null;
                return payload;
            })
            .catch(err => {
                // 실패 시 promise 만료 → 다음 클릭에서 재시도 허용
                formulasCachePromise = null;
                throw err;
            });
        return formulasCachePromise;
    }

    /**
     * Aggregate parts into the CCS견적금액 (sum of purchasePrice) and
     * BRT견적금액 (sum of sellingPrice * 무라텍 multiplier) input fields.
     *
     * Triggered manually by the "견적금액 추가" button. If the table is
     * empty, alerts the user and leaves the input values untouched so
     * any existing manual entry is preserved.
     *
     * BRT견적금액은 원화보기/엔화보기 토글 상태와 무관하게 항상 원화보기 환산값(원화 기준)으로
     * 합산된다. 판매가(sellingPrice) 합계에 /api/formulas의 '무라텍' 산출식 환산 계수를 곱한다.
     */
    function recalcAmountTotals() {
        if (!partsTable) return;
        const ccsInput = document.getElementById('ccsAmount');
        const brtInput = document.getElementById('brtAmount');
        if (!ccsInput || !brtInput) return;

        const data = partsTable.getData();
        if (!data || data.length === 0) {
            alert('합산할 부품이 없습니다.');
            return;
        }

        // ccsAmount(매입가)는 항상 엔화 합계(purchasePrice)로 채운다.
        let purchaseSum = 0;
        for (const row of data) {
            const p = Number(row.purchasePrice);
            if (Number.isFinite(p)) purchaseSum += p;
        }
        ccsInput.value = '￥' + Math.round(purchaseSum).toLocaleString();

        // brtAmount(공급가)는 원화보기/엔화보기 토글과 무관하게 항상 원화 기준으로 합산한다.
        // '무라텍' 산출식의 환산 계수(sellingMult)를 sellingPrice 합계에 곱해 산출한다.
        fetchFormulasCached()
            .then(payload => {
                const formulas = (payload && Array.isArray(payload.data)) ? payload.data : [];
                const sellingFormula = formulas.find(f => matchesFormula(f, '무라텍'));
                if (!sellingFormula) {
                    alert('해당되는 산출식이 없습니다, 확인바람');
                    return;
                }
                const sellingMult = multiplyFormulaItems(sellingFormula.items);

                let sellingKrwSum = 0;
                for (const row of data) {
                    const s = Number(row.sellingPrice);
                    if (Number.isFinite(s)) {
                        sellingKrwSum += s * sellingMult;
                    }
                }
                brtInput.value = '￦' + Math.round(sellingKrwSum).toLocaleString();
            })
            .catch(err => {
                console.error('recalcAmountTotals fetch error:', err);
                alert('산출식 정보를 가져오지 못했습니다: ' + err.message);
            });
    }

    /**
     * Tabulator는 editor:false 컬럼에 대해 row.update()로 데이터를 갱신해도 formatter가
     * 재호출되지 않는다. setData()는 초기화 시 verticalFillMode null 에러로 실패하므로 피하고,
     * 각 cell element에 formatter 결과를 직접 innerHTML로 써넣어 강제 재렌더한다.
     * row.update()는 비동기로 cell을 다시 그릴 수 있어, requestAnimationFrame으로 한 프레임 뒤에
     * 덮어써서 race condition을 회피한다.
     */
    function rerenderPriceCells() {
        if (!partsTable) return;
        const colMap = [
            { field: 'priceJpy',      krwField: 'priceKrw' },
            { field: 'purchasePrice', krwField: 'purchaseKrw' },
            { field: 'sellingPrice',  krwField: 'sellingKrw' }
        ];
        const apply = function () {
            partsTable.getRows().forEach(function (row) {
                const d = row.getData();
                colMap.forEach(function (cm) {
                    const cell = row.getCell(cm.field);
                    if (!cell) return;
                    const v = window.isKrwView ? d[cm.krwField] : cell.getValue();
                    let display;
                    if (v === null || v === undefined || v === '') {
                        display = '';
                    } else {
                        display = (window.isKrwView ? '￦' : '') + Number(v).toLocaleString();
                    }
                    const el = cell.getElement();
                    if (el) el.innerHTML = display;
                });
            });
        };
        if (typeof requestAnimationFrame === 'function') {
            requestAnimationFrame(apply);
        } else {
            setTimeout(apply, 0);
        }
    }

    /**
     * 원화보기 토글 핸들러.
     * - OFF → ON: /api/formulas에서 '바라텍'/'무라텍' 산출식을 찾아 items.multiplier를 곱한 값으로
     *   priceKrw/purchaseKrw/sellingKrw 임시 필드를 계산해 행에 주입한다.
     * - 매칭되는 산출식이 하나라도 없으면 경고 alert 후 OFF 상태로 유지한다.
     * - ON → OFF: 임시 KRW 필드를 제거하여 원본(JPY) 표시로 복귀.
     */
    function toggleKrwView() {
        const btn = document.getElementById('btn-toggle-krw');
        if (!btn) return;

        const wasKrwView = window.isKrwView === true;

        if (wasKrwView) {
            // ON → OFF: 임시 KRW 필드 제거 + 원본 JPY 셀로 강제 재렌더
            if (partsTable) {
                partsTable.getRows().forEach(function (row) {
                    row.update({ priceKrw: null, purchaseKrw: null, sellingKrw: null });
                });
                rerenderPriceCells();
            }
            window.isKrwView = false;
            btn.setAttribute('aria-pressed', 'false');
            btn.innerHTML = '<i class="bi bi-currency-exchange"></i> 원화보기';
            return;
        }

        // OFF → ON: 산출식 조회
        if (!partsTable) return;

        fetchFormulasCached()
            .then(payload => {
                const formulas = (payload && Array.isArray(payload.data)) ? payload.data : [];

                const purchaseFormula = formulas.find(f => matchesFormula(f, '바라텍'));
                const sellingFormula = formulas.find(f => matchesFormula(f, '무라텍'));

                if (!purchaseFormula || !sellingFormula) {
                    alert('해당되는 산출식이 없습니다, 확인바람');
                    return;
                }

                const purchaseMult = multiplyFormulaItems(purchaseFormula.items);
                const sellingMult = multiplyFormulaItems(sellingFormula.items);
                // 이후 applyKrwFieldsToRow()가 즉시 참조할 수 있도록 multiplier를 캐시에 보관.
                rememberFormulaMultipliers(purchaseMult, sellingMult);

                // 상태 ON 전환
                window.isKrwView = true;
                btn.setAttribute('aria-pressed', 'true');
                btn.innerHTML = '<i class="bi bi-currency-exchange"></i> 엔화보기';

                // 각 행에 KRW 임시 필드 계산/주입
                partsTable.getRows().forEach(function (row) {
                    const d = row.getData();
                    const pj = Number(d.priceJpy);
                    const pp = Number(d.purchasePrice);
                    const sp = Number(d.sellingPrice);
                    row.update({
                        priceKrw: Number.isFinite(pj) ? Math.round(pj * purchaseMult) : null,
                        purchaseKrw: Number.isFinite(pp) ? Math.round(pp * purchaseMult) : null,
                        sellingKrw: Number.isFinite(sp) ? Math.round(sp * sellingMult) : null
                    });
                });
                // editor:false 셀의 formatter는 데이터 변경만으로 재호출되지 않으므로
                // cell element에 직접 렌더링 결과를 써넣어 강제 재렌더.
                rerenderPriceCells();
            })
            .catch(err => {
                console.error('toggleKrwView fetch error:', err);
                alert('산출식 정보를 가져오지 못했습니다: ' + err.message);
            });
    }

    /**
     * formula의 code 또는 description에 keyword가 포함되는지 검사 (대소문자 무시).
     */
    function matchesFormula(formula, keyword) {
        if (!formula || !keyword) return false;
        const k = String(keyword).toLowerCase();
        const code = (formula.code || '').toString().toLowerCase();
        const desc = (formula.description || '').toString().toLowerCase();
        return code.indexOf(k) !== -1 || desc.indexOf(k) !== -1;
    }

    /**
     * formula의 items를 sortOrder 오름차순으로 정렬 후 multiplier를 모두 곱한 값을 반환.
     * null multiplier는 스킵, items가 비어있으면 1(변화 없음).
     * 서버의 Formula.calculate()와 동일한 곱셈 의미.
     */
    function multiplyFormulaItems(items) {
        if (!Array.isArray(items) || items.length === 0) return 1;
        const ordered = items.slice().sort((a, b) => {
            const ao = (a && a.sortOrder != null) ? Number(a.sortOrder) : 0;
            const bo = (b && b.sortOrder != null) ? Number(b.sortOrder) : 0;
            return ao - bo;
        });
        let result = 1;
        for (const it of ordered) {
            const m = (it && it.multiplier != null) ? Number(it.multiplier) : NaN;
            if (Number.isFinite(m)) result *= m;
        }
        return result;
    }

    function updateSortOrders() {
        const rows = partsTable.getRows();
        rows.forEach((row, index) => {
            row.update({ sortOrder: index });
        });
    }

    function deletePartByPartNumber(partNumber) {
            const row = partsTable.getRows().find(row => row.getData().partNumber === partNumber);
        if (row) {
            row.delete();
            updateSortOrders();
        }
    }

    function addPartToTable(partData) {
        // Check if part already exists in table
        const existingRows = partsTable.getRows();
        for (const row of existingRows) {
            if (row.getData().partNumber === partData.partNumber) {
                alert('이미 추가된 부품입니다: ' + partData.partNumber);
                return;
            }
        }

        const newSortOrder = partsTable.getDataCount();
        const newRow = {
            partName: partData.partName,  // Part's partName becomes partName
            partNumber: partData.partNumber,
            spec: partData.spec || '',
            priceJpy: partData.priceJpy,
            quantity: 1,
            sortOrder: newSortOrder
        };
        applyPriceCalculations(newRow);
        const added = partsTable.addRow(newRow, true); // true = add to top, false = add to bottom

        // addRow()가 비동기로 row를 그릴 수 있어, 안정적인 row 인스턴스를 보장하기 위해
        // partNumber로 다시 한 번 찾는다. 없으면 addRow()가 반환한 객체를 그대로 사용.
        const resolveAddedRow = () => {
            if (added && typeof added.getElement === 'function') return added;
            return partsTable.getRows().find(r => r.getData().partNumber === newRow.partNumber) || null;
        };

        // Tabulator는 addRow() 직후 곧바로 row.update()를 부르면 내부 렌더 사이클과
        // 경합이 생겨 셀에 빈 값이 한 프레임 보일 수 있다. requestAnimationFrame으로
        // 한 프레임 미룬 뒤 recalcRowPrices()를 호출한다. recalcRowPrices()는 원화보기
        // 모드에서 캐시 미스면 fetchFormulasCached()로 multiplier를 가져와 KRW 필드까지
        // 채워주므로, addPartToTable()에서 별도의 fetch 보정이 필요 없다.
        const applyRecalc = () => {
            const row = resolveAddedRow();
            if (row) {
                recalcRowPrices(row);
            }
        };
        if (typeof requestAnimationFrame === 'function') {
            requestAnimationFrame(applyRecalc);
        } else {
            setTimeout(applyRecalc, 0);
        }

        updateSortOrders();
    }

    // Open parts management popup
    function openPartPopup() {
        const popupUrl = '/parts?popup=true';
        const popupFeatures = 'width=1000,height=700,scrollbars=yes,resizable=yes,menubar=no,toolbar=no,location=no,status=no';
        
        partPopupWindow = window.open(popupUrl, 'partSelectPopup', popupFeatures);
        
        if (!partPopupWindow || partPopupWindow.closed || typeof partPopupWindow.closed === 'undefined') {
            // Popup blocked - fallback to alert
            alert('팝업이 차단되었습니다. 브라우저 설정에서 팝업을 허용해주세요.');
            return;
        }
        
        // Focus the popup
        partPopupWindow.focus();
    }

    // Listen for messages from popup window
    window.addEventListener('message', function(event) {
        // Verify the message is from our popup
        if (event.data && event.data.type === 'PART_SELECTED') {
            const partData = event.data.part;
            addPartToTable(partData);
            
            // Close popup if still open
            if (partPopupWindow && !partPopupWindow.closed) {
                partPopupWindow.close();
            }
            partPopupWindow = null;
        }
    });
</script>
</html>
