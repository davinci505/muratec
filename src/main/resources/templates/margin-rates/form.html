<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{}, ~{})}"
      th:with="activePage='marginRates'">
<head>
    <title th:text="${rateForm.id != null ? '환율/제비용 수정 - MURATEC' : '환율/제비용 추가 - MURATEC'}">Rate Form</title>
</head>
<body>
    <div class="content">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0" th:text="${rateForm.id != null ? '환율/제비용 수정' : '환율/제비용 추가'}"></h2>
                    </div>
                    <div class="card-body">
                        <form th:action="${rateForm.id != null ? '/margin-rates/' + rateForm.id : '/margin-rates'}"
                              th:object="${rateForm}"
                              method="post">

                            <div class="mb-3">
                                <label for="name" class="form-label">이름</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="yenExchangeRate" class="form-label">환율</label>
                                    <input type="number" step="0.01" class="form-control" id="yenExchangeRate" th:field="*{yenExchangeRate}" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="marginRate" class="form-label">마진값</label>
                                    <input type="number" step="0.01" class="form-control" id="marginRate" th:field="*{marginRate}" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="transportClearanceRate" class="form-label">운임및통관경비(%)</label>
                                    <input type="number" step="0.01" class="form-control" id="transportClearanceRate" th:field="*{transportClearanceRate}" required>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <span th:text="${rateForm.id != null ? '수정' : '등록'}"></span>
                                </button>
                                <a href="/margin-rates" class="btn btn-secondary">취소</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
