<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{}, ~{::script})}"
      th:with="activePage='parts'">
<head>
    <title>부품 대량 등록 (Excel) - BARATEC</title>
</head>
<body>
    <div class="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h2 class="mb-0"><i class="bi bi-file-earmark-spreadsheet"></i> 부품 대량 등록 (Excel)</h2>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <h5>엑셀 파일 형식 안내</h5>
                            <ul class="mb-0">
                                <li>첫 번째 행은 헤더로 사용됩니다 (무시됨)</li>
                                <li>열 순서: <strong>품번, 부품명, 스펙, 가격(엔화)</strong></li>
                                <li>이미 존재하는 품번인 경우 자동으로 업데이트됩니다</li>
                                <li>가격은 숫자만 입력 (예: 15000, 쉼표/원화 기호 불가)</li>
                            </ul>
                        </div>

                        <div class="card mb-3 border-success">
                            <div class="card-body py-3">
                                <div class="d-flex align-items-center justify-content-between">
                                    <div>
                                        <h6 class="mb-1"><i class="bi bi-file-earmark-spreadsheet text-success"></i> 샘플 엑셀 템플릿</h6>
                                        <small class="text-muted">아래 버튼을 눌러 양식이 미리 채워진 엑셀을 다운받은 뒤, 데이터를 채워 업로드하세요.</small>
                                    </div>
                                    <a href="/parts/bulk/template" class="btn btn-success">
                                        <i class="bi bi-download"></i> 템플릿 다운로드
                                    </a>
                                </div>
                            </div>
                        </div>

                        <form id="bulkForm" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="excelFile" class="form-label">엑셀 파일 선택 (.xlsx)</label>
                                <input type="file" class="form-control" id="excelFile" name="file" accept=".xlsx,.xls" required>
                                <div class="form-text">최대 10MB, .xlsx 형식 권장</div>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success" id="submitBtn">
                                    <i class="bi bi-upload"></i> 업로드 및 등록
                                </button>
                                <a href="/parts" class="btn btn-secondary">취소</a>
                            </div>
                        </form>

                        <div id="resultArea" class="mt-4" style="display: none;">
                            <div class="alert" id="resultAlert"></div>
                            <div id="resultDetails"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('bulkForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultArea = document.getElementById('resultArea');
        const resultAlert = document.getElementById('resultAlert');
        const resultDetails = document.getElementById('resultDetails');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('excelFile');
            if (!fileInput.files.length) {
                alert('파일을 선택해주세요.');
                return;
            }

            const file = fileInput.files[0];
            if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
                alert('엑셀 파일(.xlsx, .xls)만 업로드 가능합니다.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 처리 중...';
            resultArea.style.display = 'none';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/parts/bulk', {
                    method: 'POST',
                    body: formData
                });
                const text = await response.text();
                
                if (text.startsWith('success:')) {
                    const count = text.split(':')[1];
                    resultAlert.className = 'alert alert-success';
                    resultAlert.innerHTML = `<strong>성공!</strong> ${count}개 부품이 등록/업데이트되었습니다.`;
                    resultDetails.innerHTML = '<a href="/parts" class="btn btn-primary btn-sm">부품 목록으로 이동</a>';
                } else if (text.startsWith('error:')) {
                    const msg = text.split(':')[1];
                    resultAlert.className = 'alert alert-danger';
                    resultAlert.innerHTML = `<strong>실패:</strong> ${msg}`;
                } else {
                    resultAlert.className = 'alert alert-warning';
                    resultAlert.innerHTML = `<strong>알 수 없는 응답:</strong> ${text}`;
                }
            } catch (error) {
                resultAlert.className = 'alert alert-danger';
                resultAlert.innerHTML = `<strong>오류:</strong> ${error.message}`;
            } finally {
                resultArea.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-upload"></i> 업로드 및 등록';
            }
        });
    });
</script>
</html>
