<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::.content}, ~{}, ~{})}"
    th:with="activePage='parts'">

<head>
    <title>부품등록 관리 - BARATEC</title>
</head>

<body>
    <div class="content">
        <h1 class="mb-4 text-center">부품등록 관리</h1>

        <div class="mb-3 d-flex flex-wrap gap-2 align-items-center">
            <a href="/parts/new" class="btn btn-primary">새 부품 추가</a>
            <a href="/parts/bulk" class="btn btn-success">📊 엑셀 대량 등록</a>

            <form method="get" action="/parts" class="ms-auto d-flex flex-wrap gap-2 align-items-center">
                <label for="partNumber" class="form-label mb-0">품번</label>
                <input id="partNumber" name="partNumber" type="text" class="form-control form-control-sm"
                    style="width: 160px;" placeholder="품번 검색" th:value="${partNumber}">
                <label for="description" class="form-label mb-0">부품설명</label>
                <input id="description" name="description" type="text" class="form-control form-control-sm"
                    style="width: 180px;" placeholder="부품설명 검색" th:value="${description}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">검색</button>
            </form>
        </div>

        <div th:if="${list.isEmpty()}" class="alert alert-info">
            등록된 부품이 없습니다.
        </div>

        <div th:if="${!list.isEmpty()}" class="table-responsive">
            <table class="table table-striped table-bordered table-hover" style="font-size: 0.75rem;">
                <thead>
                    <tr style="background-color: #2c3e50; color: white;">
                        <th class="col-short" style="width: 5%;">No.</th>
                        <th class="col-medium" style="width: 15%;">품번</th>
                        <th class="col-long" style="width: 25%;">부품설명</th>
                        <th class="col-long" style="width: 35%;">스펙</th>
                        <th class="col-medium" style="width: 15%;">가격(엔화)</th>
                        <th class="col-short" style="width: 5%;">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item, iterStat : ${list}">
                        <td th:text="${iterStat.count}"></td>
                        <td th:text="${item.partNumber}"></td>
                        <td th:text="${item.description}"></td>
                        <td th:text="${item.spec}"></td>
                        <td class="text-end" th:text="${'￥' + #numbers.formatDecimal(item.priceJpy, 1, 2, 'POINT')}"></td>
                        <td>
                            <div class="d-flex gap-1 justify-content-center">
                                <a th:href="@{/parts/edit/{id}(id=${item.id})}"
                                    class="btn btn-sm btn-outline-primary px-2" title="수정" aria-label="수정">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/parts/delete/{id}(id=${item.id})}"
                                    class="btn btn-sm btn-outline-danger px-2" title="삭제" aria-label="삭제"
                                    onclick="return confirm('삭제하시겠습니까?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
